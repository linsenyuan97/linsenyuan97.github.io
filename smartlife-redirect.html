<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>前往智生活公告</title>
<style>
  body{font-family:'Microsoft JhengHei','Noto Sans TC',sans-serif;background:#f8fafc;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px;box-sizing:border-box}
  .card{background:#fff;border-radius:20px;padding:36px 24px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.08);max-width:320px;width:100%}
  img{width:68px;height:68px;margin-bottom:18px;border-radius:14px}
  h2{font-size:19px;margin:0 0 10px;color:#1e293b;font-weight:700}
  p{color:#64748b;font-size:14px;line-height:1.6;margin:0 0 16px}
  a.btn{display:block;padding:13px 24px;background:#06C755;color:#fff;border-radius:24px;text-decoration:none;font-weight:700;font-size:15px;margin-bottom:12px;box-shadow:0 4px 12px rgba(6,199,85,0.25)}
  a.back-btn{display:block;padding:11px 24px;background:#f1f5f9;color:#475569;border-radius:24px;text-decoration:none;font-size:14px;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <img src="icons/smartdaily/icon.png" alt="智生活">
    <h2 id="titleText">開啟「智生活」App</h2>
    <p id="descText">即將前往智生活 App。</p>
    <a class="btn" id="openBtn" href="kingnetsmartapp://Ann">立即開啟智生活 APP</a>
    <a class="back-btn" href="javascript:void(0)" onclick="closeWindow(); return false;">返回 LINE 聊天室</a>
  </div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const LIFF_ID = '2011594461-wlr3nDOx';

    if (typeof liff !== 'undefined') {
      liff.init({ liffId: LIFF_ID }).catch(function(err) {
        console.error('LIFF init error:', err);
      });
    }

    function closeWindow() {
      if (typeof liff !== 'undefined' && liff.isInClient()) {
        liff.closeWindow();
        return;
      }
      try {
        if (typeof window.close === 'function') window.close();
      } catch(e){}
      try {
        if (history.length > 1) history.back();
      } catch(e){}
    }

    // 用 ?target= 決定要跳轉到智生活的哪個頁面：
    //   Ann（預設）= 公佈欄公告，Res = 公設預約
    // LINE 的 Flex 按鈕 uri 動作不支援直接放自訂 App Scheme（例如 kingnetsmartapp://），
    // 只能連到 http/https 網址，所以一律先連到這個中繼頁，由頁面裡的 JS 再跳轉真正的 App Scheme。
    const params = new URLSearchParams(location.search);
    const target = params.get('target') === 'Res' ? 'Res' : 'Ann';
    const scheme = 'kingnetsmartapp://' + target;

    if (target === 'Res') {
      document.getElementById('titleText').textContent = '前往智生活公設預約';
      document.getElementById('descText').textContent = '即將前往智生活 App，查看公設預約狀況並完成預約。';
    }
    document.getElementById('openBtn').setAttribute('href', scheme);

    location.href = scheme;
    setTimeout(closeWindow, 1500);
  </script>
</body>
</html>
