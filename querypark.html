<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B1 地下停車場查詢系統</title>
<meta name="description" content="B1 地下一層停車場互動查詢系統，輸入車位編號即可查看位置及最佳行駛路線建議">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================
   ROOT VARIABLES & RESET
   ============================ */
:root {
  --bg-primary:   #080d1a;
  --bg-secondary: #0d1526;
  --bg-panel:     #101d34;
  --glass-bg:     rgba(255,255,255,0.04);
  --glass-border: rgba(255,255,255,0.08);
  --accent-cyan:  #00d4ff;
  --accent-blue:  #2563eb;
  --accent-gold:  #f59e0b;
  --accent-green: #10b981;
  --accent-red:   #ef4444;
  --accent-orange:#f97316;
  --text-1: #f1f5f9;
  --text-2: #94a3b8;
  --text-3: #475569;
  --sp-regular: #1a3a6a;
  --sp-regular-stroke: #2563eb;
  --sp-disabled: #0f4a3a;
  --sp-disabled-stroke: #059669;
  --sp-selected: #92400e;
  --sp-selected-stroke: #f59e0b;
  --sidebar-w: 340px;
  --radius: 14px;
  --radius-sm: 8px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }
body {
  font-family: 'Inter','Noto Sans TC', sans-serif;
  background: var(--bg-primary);
  color: var(--text-1);
  display: flex;
}

/* ============================
   SIDEBAR
   ============================ */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--bg-secondary);
  border-right: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 4px 0 24px rgba(0,0,0,0.4);
}

/* Header */
.sidebar-header {
  padding: 22px 20px 18px;
  background: linear-gradient(135deg, rgba(0,212,255,0.08) 0%, rgba(37,99,235,0.04) 100%);
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}
.sidebar-header h1 {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: 0.3px;
  color: var(--accent-cyan);
  margin-bottom: 3px;
}
.sidebar-header p {
  font-size: 0.72rem;
  color: var(--text-3);
  letter-spacing: 0.2px;
}

/* Stats bar */
.stats-bar {
  display: flex;
  gap: 6px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}
.stat-box {
  flex: 1;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 8px 4px;
  text-align: center;
}
.stat-num {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--accent-cyan);
  line-height: 1;
}
.stat-lbl {
  font-size: 0.58rem;
  color: var(--text-3);
  margin-top: 2px;
  font-weight: 500;
}

/* Search section */
.search-section {
  padding: 16px;
  border-bottom: 1px solid var(--glass-border);
  flex-shrink: 0;
}
.search-lbl {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
}
.search-wrap {
  position: relative;
}
.search-input {
  width: 100%;
  padding: 11px 44px 11px 38px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid var(--glass-border);
  border-radius: var(--radius-sm);
  color: var(--text-1);
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 1.5px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.search-input::placeholder { color: var(--text-3); letter-spacing: 0; font-weight: 400; }
.search-input:focus {
  border-color: var(--accent-cyan);
  background: rgba(0,212,255,0.06);
  box-shadow: 0 0 0 3px rgba(0,212,255,0.12);
}
.search-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  font-size: 1rem;
  pointer-events: none;
}
.search-clear {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none;
  color: var(--text-3); font-size: 1rem;
  cursor: pointer; display: none;
  transition: color .15s;
}
.search-clear:hover { color: var(--text-1); }
.search-btn {
  width: 100%;
  margin-top: 9px;
  padding: 11px;
  background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
  border: none;
  border-radius: var(--radius-sm);
  color: #fff;
  font-family: inherit;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: transform .15s, box-shadow .15s;
}
.search-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(0,212,255,0.28);
}
.search-btn:active { transform: translateY(0); }

/* Suggestions dropdown */
.suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg-panel);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  z-index: 100;
  box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  display: none;
}
.sug-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  cursor: pointer;
  transition: background .12s;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.sug-item:last-child { border-bottom: none; }
.sug-item:hover { background: rgba(255,255,255,0.06); }
.sug-id { font-weight: 700; font-size: 0.9rem; color: var(--text-1); letter-spacing: 1px; }
.sug-badge {
  font-size: 0.62rem; font-weight: 600;
  padding: 2px 7px; border-radius: 4px;
}
.badge-reg { background: rgba(37,99,235,0.2); color: #60a5fa; }
.badge-dis { background: rgba(16,185,129,0.2); color: #34d399; }
.sug-zone { font-size: 0.68rem; color: var(--text-3); margin-left: auto; }

/* Error message */
.err-msg {
  margin-top: 7px;
  padding: 9px 12px;
  background: rgba(239,68,68,0.08);
  border: 1px solid rgba(239,68,68,0.25);
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  color: #fca5a5;
  display: none;
}
.err-msg.show { display: block; }

/* Result panel (scrollable) */
.result-panel {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}
.result-panel::-webkit-scrollbar { width: 4px; }
.result-panel::-webkit-scrollbar-track { background: transparent; }
.result-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-3);
}
.empty-icon { font-size: 2.8rem; margin-bottom: 14px; opacity: 0.5; }
.empty-state p { font-size: 0.82rem; line-height: 1.7; }

/* Result card */
.result-card {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  display: none;
}
.result-card.show { display: block; }
.rc-head {
  display: flex; align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}
.rc-num {
  font-size: 2rem;
  font-weight: 800;
  color: var(--accent-gold);
  letter-spacing: 2px;
  line-height: 1;
}
.rc-num-lbl {
  font-size: 0.62rem;
  color: var(--text-3);
  margin-bottom: 2px;
  font-weight: 500;
}
.type-badge {
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.type-reg  { background: rgba(37,99,235,0.18);  color: #60a5fa; border: 1px solid rgba(37,99,235,0.3); }
.type-dis  { background: rgba(16,185,129,0.18); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
}
.info-cell {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 7px;
  padding: 8px 10px;
}
.info-cell-lbl { font-size: 0.6rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.info-cell-val { font-size: 0.82rem; font-weight: 600; color: var(--text-1); }

/* Route section */
.route-section {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  padding: 14px;
  display: none;
}
.route-section.show { display: block; }
.route-hdr {
  display: flex; align-items: center; gap: 7px;
  font-size: 0.82rem; font-weight: 700;
  color: var(--accent-green);
  margin-bottom: 13px;
}
.route-step { display: flex; gap: 11px; align-items: flex-start; }
.step-dot {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-green);
  color: #fff; font-size: 0.68rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
}
.step-txt { font-size: 0.78rem; color: var(--text-2); line-height: 1.55; }
.step-line {
  width: 1.5px; height: 10px;
  background: rgba(16,185,129,0.25);
  margin-left: 10px; margin-bottom: 2px; margin-top: 2px;
}

/* Legend */
.legend {
  padding: 12px 16px;
  border-top: 1px solid var(--glass-border);
  display: flex; flex-wrap: wrap; gap: 10px;
  flex-shrink: 0;
}
.leg-item { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; color: var(--text-2); }
.leg-swatch { width: 18px; height: 11px; border-radius: 2px; }

/* ============================
   MAP AREA
   ============================ */
.map-area {
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  background: radial-gradient(ellipse at 40% 30%, #0e1f3d 0%, var(--bg-primary) 65%);
}
.map-area::-webkit-scrollbar { width: 6px; height: 6px; }
.map-area::-webkit-scrollbar-track { background: transparent; }
.map-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }

#floorplan {
  display: block;
  filter: drop-shadow(0 24px 64px rgba(0,0,0,0.6));
  border-radius: 8px;
}

/* ============================
   ZOOM CONTROLS
   ============================ */
.zoom-ctrls {
  position: fixed;
  right: 20px; bottom: 24px;
  display: flex; flex-direction: column; gap: 4px;
  z-index: 50;
}
.zoom-btn {
  width: 38px; height: 38px;
  background: var(--bg-panel);
  border: 1px solid var(--glass-border);
  border-radius: 9px;
  color: var(--text-1);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, border-color .15s, transform .1s;
  user-select: none;
}
.zoom-btn:hover { background: rgba(0,212,255,0.1); border-color: var(--accent-cyan); }
.zoom-btn:active { transform: scale(0.92); }

/* ============================
   SVG ANIMATIONS
   ============================ */
@keyframes space-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
.sp-highlight { animation: space-pulse 1.1s ease-in-out infinite; }

@keyframes route-dash {
  from { stroke-dashoffset: 500; }
  to   { stroke-dashoffset: 0; }
}
.route-animated {
  stroke-dasharray: 14 9;
  animation: route-dash 2.5s linear infinite;
}

@keyframes ping-expand {
  0%   { r: 8; opacity: 1; }
  100% { r: 22; opacity: 0; }
}
.ping-circle { animation: ping-expand 1.8s ease-out infinite; }

@keyframes entrance-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.entrance-blink { animation: entrance-blink 2s ease-in-out infinite; }
</style>
</head>
<body>

<!-- ============================
     SIDEBAR
     ============================ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <h1>🅿 B1 停車場查詢</h1>
    <p>地下一層 · 車位查詢與行駛導引系統</p>
  </div>

  <div class="stats-bar">
    <div class="stat-box">
      <div class="stat-num" id="totalCount">--</div>
      <div class="stat-lbl">總車位</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="regCount">--</div>
      <div class="stat-lbl">一般車位</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="disCount">--</div>
      <div class="stat-lbl">殘障車位</div>
    </div>
  </div>

  <div class="search-section">
    <div class="search-lbl">🔍 車位編號查詢</div>
    <div class="search-wrap">
      <span class="search-icon">🔎</span>
      <input id="searchInput" class="search-input" type="text"
             placeholder="輸入車位編號（如 A001）"
             autocomplete="off" spellcheck="false">
      <button class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
      <div class="suggestions" id="suggestions"></div>
    </div>
    <div class="err-msg" id="errMsg">❌ 查無此車位，請確認編號後重試</div>
    <button class="search-btn" onclick="doSearch()">查詢車位 &amp; 顯示路線</button>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗺️</div>
      <p>請在上方輸入車位編號<br>系統將顯示位置並提供<br>從 1F 進入後的行駛建議</p>
    </div>

    <!-- Result card -->
    <div class="result-card" id="resultCard">
      <div class="rc-head">
        <div>
          <div class="rc-num-lbl">查詢車位</div>
          <div class="rc-num" id="rcNum">---</div>
        </div>
        <span class="type-badge" id="rcBadge">---</span>
      </div>
      <div class="info-grid">
        <div class="info-cell">
          <div class="info-cell-lbl">樓層</div>
          <div class="info-cell-val">B1 地下一層</div>
        </div>
        <div class="info-cell">
          <div class="info-cell-lbl">所在區域</div>
          <div class="info-cell-val" id="rcZone">---</div>
        </div>
        <div class="info-cell">
          <div class="info-cell-lbl">建議入口</div>
          <div class="info-cell-val">底部車道入口</div>
        </div>
        <div class="info-cell">
          <div class="info-cell-lbl">預估時間</div>
          <div class="info-cell-val" id="rcTime">---</div>
        </div>
      </div>
    </div>

    <!-- Route section -->
    <div class="route-section" id="routeSection">
      <div class="route-hdr">🛣️ 建議行駛路線（從 1F 入口）</div>
      <div id="routeSteps"></div>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="leg-item">
      <div class="leg-swatch" style="background:#1a3a6a;border:1px solid #2563eb"></div>一般車位
    </div>
    <div class="leg-item">
      <div class="leg-swatch" style="background:#0f4a3a;border:1px solid #059669"></div>殘障車位
    </div>
    <div class="leg-item">
      <div class="leg-swatch" style="background:#f59e0b"></div>已選車位
    </div>
    <div class="leg-item">
      <div class="leg-swatch" style="background:#10b981"></div>建議路線
    </div>
  </div>
</aside>

<!-- ============================
     FLOOR PLAN SVG
     ============================ -->
<main class="map-area" id="mapArea">
<svg id="floorplan" viewBox="0 0 840 1420" width="520" height="880">
<defs>
  <pattern id="gridPat" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
  </pattern>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <marker id="arrowGreen" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
    <polygon points="0 0, 7 3.5, 0 7" fill="#10b981"/>
  </marker>
  <linearGradient id="exitGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#dc2626"/>
    <stop offset="100%" stop-color="#991b1b"/>
  </linearGradient>
  <linearGradient id="entryGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16a34a"/>
    <stop offset="100%" stop-color="#14532d"/>
  </linearGradient>
</defs>

<!-- ① BUILDING BACKGROUND -->
<rect width="840" height="1420" fill="#0c1424"/>
<rect width="840" height="1420" fill="url(#gridPat)"/>
<!-- Building floor surface -->
<rect x="14" y="14" width="812" height="1392" rx="5" fill="#162030" stroke="#1e3050" stroke-width="2"/>
<!-- Interior driving area -->
<rect x="17" y="17" width="806" height="1386" rx="4" fill="#192538"/>

<rect x="595" y="80" width="165" height="1260" rx="0" fill="#1e2d42" opacity="0.7"/>

<line x1="342" y1="68" x2="386" y2="68" stroke="#2d4a6e" stroke-width="1"/>
<line x1="342" y1="76" x2="386" y2="76" stroke="#2d4a6e" stroke-width="1"/>
<line x1="342" y1="84" x2="386" y2="84" stroke="#2d4a6e" stroke-width="1"/>
<line x1="342" y1="92" x2="386" y2="92" stroke="#2d4a6e" stroke-width="1"/>
<line x1="342" y1="100" x2="386" y2="100" stroke="#2d4a6e" stroke-width="1"/>

<line x1="440" y1="92" x2="484" y2="92" stroke="#2d4a6e" stroke-width="1"/>
<line x1="440" y1="100" x2="484" y2="100" stroke="#2d4a6e" stroke-width="1"/>

<!-- 橫厝廊 -->

<!-- 飲用純水機房 -->
<rect x="14" y="590" width="100" height="80" rx="0" fill="#16243a" stroke="#253b5e" stroke-width="1.5"/>
<text x="64" y="625" text-anchor="middle" font-family="Noto Sans TC" font-size="8" fill="#334d6a">飲用純水</text>
<text x="64" y="638" text-anchor="middle" font-family="Noto Sans TC" font-size="8" fill="#334d6a">機房</text>

<script>
/* ===========================================
   PARKING SPACE DATA
   ===========================================
   Each space: { id, x, y, w, h, type, zone, zoneName, walkTime }
   type: 'regular' | 'handicapped'
   x,y: top-left corner in SVG coordinates (840×1420 space)
   w: width (shorter side, parallel to wall line)
   h: height (longer side, depth into space)
   
   LAYOUT OVERVIEW:
   - A section: top-left horizontal spaces (against top wall)
   - B section: top-right horizontal spaces (against top wall)
   - C section: left wall vertical column
   - D section: right wall vertical column
   - E section: upper oval interior, left side (x≈325)
   - F section: upper oval interior, right side (x≈525) [2 handicapped]
   - H section: lower oval interior, right side (x≈525) [2 handicapped]
   - J section: bottom-left horizontal rows
   - K section: bottom-right horizontal rows
   - L section: bottom-left 3rd row (closest to entrance)
   =========================================== */

const SPACES = (() => {
  const all = [];

  // Standard dimensions
  const SW = 30;  // space width (short side, parallel to wall)
  const SD = 64;  // space depth (long side, into wall)
  const HW = 40;  // handicapped width
  const HD = 72;  // handicapped depth

  // -- A section: Top LEFT horizontal spaces (facing south / y growing) --
  const axList = [52,86,120,154,188,222,256,290];
  axList.forEach((ax, i) => {
    all.push({
      id: `A${String(i+1).padStart(3,'0')}`,
      x: ax, y: 17, w: SW, h: SD,
      type: 'regular', zone: 'A', zoneName: 'A棟左翼頂排',
      walkTime: '約4分鐘',
      accessX: ax + SW/2, accessY: 17 + SD,
    });
  });

  // -- B section: Top RIGHT horizontal spaces (facing south) --
  const bxList = [520,554,588,622,656,690,724,758];
  bxList.forEach((bx, i) => {
    all.push({
      id: `B${String(i+1).padStart(3,'0')}`,
      x: bx, y: 17, w: SW, h: SD,
      type: 'regular', zone: 'B', zoneName: 'A棟右翼頂排',
      walkTime: '約4分鐘',
      accessX: bx + SW/2, accessY: 17 + SD,
    });
  });

  // -- C section: LEFT WALL vertical column --
  // Group 1: y=230 to y=560 (before B棟 entrance area)
  for (let i = 0; i < 10; i++) {
    const cy = 230 + i * 34;
    all.push({
      id: `C${String(i+1).padStart(3,'0')}`,
      x: 17, y: cy, w: SD, h: SW,
      type: 'regular', zone: 'C', zoneName: '左側縱列',
      walkTime: '約3分鐘',
      accessX: 17 + SD, accessY: cy + SW/2,
    });
  }
  // Group 2: y=790 to y=1110 (after B棟 entrance area)
  for (let i = 0; i < 10; i++) {
    const cy = 790 + i * 34;
    all.push({
      id: `C${String(i+11).padStart(3,'0')}`,
      x: 17, y: cy, w: SD, h: SW,
      type: 'regular', zone: 'C', zoneName: '左側縱列',
      walkTime: '約2分鐘',
      accessX: 17 + SD, accessY: cy + SW/2,
    });
  }

  // -- D section: RIGHT WALL vertical column --
  // x = 840 - 17 - SD = 759
  // Group 1: y=230 to y=560
  for (let i = 0; i < 10; i++) {
    const dy = 230 + i * 34;
    all.push({
      id: `D${String(i+1).padStart(3,'0')}`,
      x: 759, y: dy, w: SD, h: SW,
      type: 'regular', zone: 'D', zoneName: '右側縱列',
      walkTime: '約3分鐘',
      accessX: 759, accessY: dy + SW/2,
    });
  }
  // Group 2: y=598 to y=1110 (no gap on right side)
  for (let i = 0; i < 15; i++) {
    const dy = 598 + i * 34;
    all.push({
      id: `D${String(i+11).padStart(3,'0')}`,
      x: 759, y: dy, w: SD, h: SW,
      type: 'regular', zone: 'D', zoneName: '右側縱列',
      walkTime: '約2分鐘',
      accessX: 759, accessY: dy + SW/2,
    });
  }

  // -- E section: Upper oval LEFT interior (spaces face right/east) --
  // Positioned at x=294 (edge of central island), opening toward x=294 from east
  // y range: 332 to 502 (inside upper oval boundary)
  const eYList = [332, 366, 400, 434, 468, 502];
  eYList.forEach((ey, i) => {
    all.push({
      id: `E${String(i+1).padStart(3,'0')}`,
      x: 294, y: ey, w: SD, h: SW,
      type: 'regular', zone: 'E', zoneName: '上圓環左內側',
      walkTime: '約2分鐘',
      accessX: 294, accessY: ey + SW/2,
    });
  });

  // -- F section: Upper oval RIGHT interior --
  // x=486 (island right edge), spaces extend toward x=550
  // 2 handicapped: F004, F005
  const fYList = [332, 366, 400, 434, 468, 502];
  fYList.forEach((fy, i) => {
    const isH = (i === 3 || i === 4);
    all.push({
      id: `F${String(i+1).padStart(3,'0')}`,
      x: 486, y: isH ? fy - 4 : fy,
      w: isH ? HD : SD,
      h: isH ? HW : SW,
      type: isH ? 'handicapped' : 'regular',
      zone: 'F', zoneName: isH ? '上圓環右內側（殘障）' : '上圓環右內側',
      walkTime: '約2分鐘',
      accessX: 486, accessY: (isH ? fy - 4 : fy) + (isH ? HW : SW) / 2,
    });
  });

  // -- H section: Lower oval RIGHT interior (2 handicapped) --
  // Similar to F but for lower oval, y range 762-964
  const hYList = [762, 796, 830, 864, 898, 932, 966];
  hYList.forEach((hy, i) => {
    const isH = (i === 0 || i === 1);
    all.push({
      id: `H${String(i+1).padStart(3,'0')}`,
      x: 486, y: isH ? hy - 4 : hy,
      w: isH ? HD : SD,
      h: isH ? HW : SW,
      type: isH ? 'handicapped' : 'regular',
      zone: 'H', zoneName: isH ? '下圓環右內側（殘障）' : '下圓環右內側',
      walkTime: '約1-2分鐘',
      accessX: 486, accessY: (isH ? hy - 4 : hy) + (isH ? HW : SW) / 2,
    });
  });

  // -- J section: Bottom LEFT horizontal rows (facing north / y decreasing) --
  // Row 1: y=1150
  [84,118,152,186,220,254,288].forEach((jx, i) => {
    all.push({
      id: `J${String(i+1).padStart(3,'0')}`,
      x: jx, y: 1150, w: SW, h: SD,
      type: 'regular', zone: 'J', zoneName: '底部左區第一排',
      walkTime: '約1分鐘',
      accessX: jx + SW/2, accessY: 1150,
    });
  });
  // Row 2: y=1220
  [84,118,152,186,220,254].forEach((jx, i) => {
    all.push({
      id: `J${String(i+8).padStart(3,'0')}`,
      x: jx, y: 1220, w: SW, h: SD,
      type: 'regular', zone: 'J', zoneName: '底部左區第二排',
      walkTime: '約1分鐘',
      accessX: jx + SW/2, accessY: 1220,
    });
  });

  // -- K section: Bottom RIGHT horizontal rows --
  // Row 1: y=1150
  [490,524,558,592,626,660,694,728,762].forEach((kx, i) => {
    all.push({
      id: `K${String(i+1).padStart(3,'0')}`,
      x: kx, y: 1150, w: SW, h: SD,
      type: 'regular', zone: 'K', zoneName: '底部右區第一排',
      walkTime: '約1分鐘',
      accessX: kx + SW/2, accessY: 1150,
    });
  });
  // Row 2: y=1220
  [490,524,558,592,626,660,694,728].forEach((kx, i) => {
    all.push({
      id: `K${String(i+10).padStart(3,'0')}`,
      x: kx, y: 1220, w: SW, h: SD,
      type: 'regular', zone: 'K', zoneName: '底部右區第二排',
      walkTime: '約1分鐘',
      accessX: kx + SW/2, accessY: 1220,
    });
  });

  // -- L section: Bottom LEFT row 3 (closest to entrance, y=1290) --
  [84,118,152,186,220].forEach((lx, i) => {
    all.push({
      id: `L${String(i+1).padStart(3,'0')}`,
      x: lx, y: 1290, w: SW, h: SD,
      type: 'regular', zone: 'L', zoneName: '底部左區第三排',
      walkTime: '不到1分鐘',
      accessX: lx + SW/2, accessY: 1290,
    });
  });

  return all;
})();

// Build lookup map
const spaceMap = {};
SPACES.forEach(s => { spaceMap[s.id] = s; });

/* ===========================================
   ROUTE STEPS DEFINITIONS
   =========================================== */
function getRouteSteps(space) {
  const id  = space.id;
  const z   = space.zone;
  const tp  = space.type === 'handicapped' ? '（殘障車位）' : '';

  const baseEntry = [
    { icon: '⬇️', text: '從「下坡入口」（1F→B1）進入地下一層，保持右側行駛' },
    { icon: '🔄', text: '進入主幹道，車道呈單向循環（逆時針）' },
  ];

  const routes = {
    L: [
      ...baseEntry,
      { icon: '↰', text: '入口後立即左轉，進入底部左側車位區' },
      { icon: '🅿', text: `抵達 ${id}${tp}，靠左停入` },

    J: [
      ...baseEntry,
      { icon: '↑', text: '沿底部主車道向前行駛約 20 公尺' },

      { icon: '🅿', text: `找到 ${id}${tp}，停入車位` },

    K: [
      ...baseEntry,
      { icon: '→', text: '右轉進入底部右側排列車位' },
      { icon: '↑', text: '沿右側車道前行，尋找目標車位號碼' },
      { icon: '🅿', text: `找到 ${id}${tp}，停入車位` },
    ],
    H: [
      ...baseEntry,
      { icon: '↑', text: '沿主車道向前行駛，進入下層圓環（逆時針）' },
      { icon: '↱', text: '在圓環右側內道行駛' },
      { icon: '🅿', text: `看到右側島緣標示 ${id}${tp}，右轉停入` },
    ],
    C: [
      ...baseEntry,
      { icon: '↑', text: '通過下層圓環，沿左側主車道繼續前行' },

      { icon: '↰', text: '靠近左側牆面縱列區域' },
      { icon: '🅿', text: `找到左牆車位 ${id}${tp}，靠左停入` },
    ],
    D: [
      ...baseEntry,
      { icon: '↑', text: '通過下層圓環，沿右側主車道繼續前行' },
      { icon: '↑', text: '經過上層圓環，保持右側行駛' },
      { icon: '↱', text: '靠近右側牆面縱列區域' },
      { icon: '🅿', text: `找到右牆車位 ${id}${tp}，靠右停入` },
    ],
    E: [
      ...baseEntry,
      { icon: '↑', text: '通過下層圓環，繼續沿左側車道前行至上層圓環' },
      { icon: '↰', text: '進入上層圓環，靠左側島緣行駛' },
      { icon: '🅿', text: `看到左側島緣標示 ${id}${tp}，左轉停入` },
    ],
    F: [
      ...baseEntry,
      { icon: '↑', text: '通過下層圓環，繼續沿右側車道前行至上層圓環' },
      { icon: '↱', text: '進入上層圓環，靠右側島緣行駛' },
      { icon: '🅿', text: `看到右側島緣標示 ${id}${tp}，右轉停入` },
    ],
    A: [
      ...baseEntry,
      { icon: '↑', text: '通過下層圓環，繼續前行' },
      { icon: '↑', text: '通過上層圓環，繼續向頂部行駛' },
      { icon: '↰', text: '到達頂部，左轉進入 A棟 左翼橫排車位區' },
      { icon: '🅿', text: `找到頂部左翼車位 ${id}${tp}，停入` },
    ],
    B: [
      ...baseEntry,
      { icon: '↑', text: '通過下層圓環，繼續前行' },
      { icon: '↑', text: '通過上層圓環，繼續向頂部行駛' },
      { icon: '↱', text: '到達頂部，右轉進入 A棟 右翼橫排車位區' },
      { icon: '🅿', text: `找到頂部右翼車位 ${id}${tp}，停入` },
    ],
  };

  return routes[z] || [
    ...baseEntry,
    { icon: '🅿', text: `依場內指示找到 ${id}${tp} 停入` },
  ];
}

/* ===========================================
   SVG RENDERING
   =========================================== */
const SVG_W = 840, SVG_H = 1420;
// Display scale: SVG viewBox vs element size
const DISP_W = 520, DISP_H = 880;
const SCALE_X = DISP_W / SVG_W;
const SCALE_Y = DISP_H / SVG_H;

function renderSpaces() {
  const layer = document.getElementById('spacesLayer');
  let html = '';

  SPACES.forEach(sp => {
    const isH = sp.type === 'handicapped';
    const fill   = isH ? '#0f4a3a' : '#1a3a6a';
    const stroke = isH ? '#059669' : '#2563eb';

    // Hatch lines across the space
    const hatchColor = isH ? 'rgba(5,150,105,0.22)' : 'rgba(37,99,235,0.2)';
    let hatches = '';
    // Draw 2-3 diagonal hatch lines
    hatches += `<line x1="${sp.x}" y1="${sp.y+sp.h}" x2="${sp.x+sp.w}" y2="${sp.y}"
                      stroke="${hatchColor}" stroke-width="1"/>`;
    hatches += `<line x1="${sp.x}" y1="${sp.y+sp.h*0.6}" x2="${sp.x+sp.w}" y2="${sp.y}"
                      stroke="${hatchColor}" stroke-width="0.7" opacity="0.6"/>`;

    // Label: fit text inside the space
    let labelEl = '';
    const cx = sp.x + sp.w / 2;
    const cy = sp.y + sp.h / 2;
    const fs  = Math.min(sp.w, sp.h) >= 30 ? 8 : 6.5;

    if (sp.w >= sp.h) {
      // Wide space: horizontal text
      labelEl = `<text x="${cx}" y="${cy + fs*0.35}" text-anchor="middle"
                       font-size="${fs}" fill="rgba(148,163,184,0.9)"
                       font-family="monospace" font-weight="600">${sp.id}</text>`;
    } else {
      // Tall space: rotate text -90°
      labelEl = `<text x="${cx}" y="${cy}" text-anchor="middle"
                       font-size="${fs}" fill="rgba(148,163,184,0.9)"
                       font-family="monospace" font-weight="600"
                       transform="rotate(-90 ${cx} ${cy})">${sp.id}</text>`;
    }

    // Wheelchair symbol for handicapped
    const symbol = isH
      ? `<text x="${cx}" y="${cy - sp.h*0.12}" text-anchor="middle"
               font-size="${Math.min(sp.w,sp.h)*0.55}" fill="#34d399" opacity="0.75">♿</text>`
      : '';

    html += `
    <g class="sp" id="sp-${sp.id}" data-id="${sp.id}" data-type="${sp.type}"
       style="cursor:pointer" onclick="selectSpace('${sp.id}')">
      <rect x="${sp.x}" y="${sp.y}" width="${sp.w}" height="${sp.h}"
            rx="2" fill="${fill}" stroke="${stroke}" stroke-width="1.3"/>
      ${hatches}
      ${symbol}
      ${labelEl}
    </g>`;
  });

  layer.innerHTML = html;
}

// Draw the route from entrance to a parking space
function drawRoute(space) {
  const layer = document.getElementById('routeLayer');

  // Entrance point (bottom "下")
  const ex = 565, ey = 1295;
  // Space center
  const sx = space.x + space.w / 2;
  const sy = space.y + space.h / 2;
  const z  = space.zone;

  // Key lane x-positions
  const leftLane  = 160;  // left main lane x
  const rightLane = 680;  // right main lane x
  const bottomY   = 1140; // bottom cross-lane y

  // Build SVG path based on section
  let d = '';
  switch(z) {
    case 'L':
      d = `M ${ex} ${ey} L ${ex} ${bottomY+20} L ${leftLane} ${bottomY+20}
           L ${leftLane} ${sy} L ${sx} ${sy}`;
      break;
    case 'J':
      d = `M ${ex} ${ey} L ${ex} ${bottomY+15} L ${leftLane} ${bottomY+15}
           L ${leftLane} 1185 L ${sx} 1185 L ${sx} ${sy}`;
      break;
    case 'K':
      d = `M ${ex} ${ey} L ${ex} ${bottomY+15} L ${rightLane} ${bottomY+15}
           L ${rightLane} 1185 L ${sx} 1185 L ${sx} ${sy}`;
      break;
    case 'H':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${rightLane} ${bottomY}
           L ${rightLane} ${sy} L ${sx} ${sy}`;
      break;
    case 'C':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${leftLane} ${bottomY}
           L ${leftLane} ${sy} L ${sx} ${sy}`;
      break;
    case 'D':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${rightLane} ${bottomY}
           L ${rightLane} ${sy} L ${sx} ${sy}`;
      break;
    case 'E':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${leftLane} ${bottomY}
           L ${leftLane} 558 L 280 558 L 280 ${sy} L ${sx} ${sy}`;
      break;
    case 'F':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${rightLane} ${bottomY}
           L ${rightLane} 558 L 556 558 L 556 ${sy} L ${sx} ${sy}`;
      break;
    case 'A':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${leftLane} ${bottomY}
           L ${leftLane} 90 L ${sx} 90 L ${sx} ${sy}`;
      break;
    case 'B':
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${rightLane} ${bottomY}
           L ${rightLane} 90 L ${sx} 90 L ${sx} ${sy}`;
      break;
    default:
      d = `M ${ex} ${ey} L ${ex} ${bottomY} L ${sx} ${bottomY} L ${sx} ${sy}`;
  }

  layer.innerHTML = `
    <!-- Route path -->
    <path d="${d}" fill="none" stroke="#10b981" stroke-width="3"
          class="route-animated"
          marker-end="url(#arrowGreen)" opacity="0.9" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Start marker (entrance) -->
    <circle cx="${ex}" cy="${ey}" r="7" fill="#22c55e" stroke="white" stroke-width="2"/>
    <!-- Ping circles around target space -->
    <circle cx="${sx}" cy="${sy}" r="8" fill="none" stroke="#f59e0b"
            stroke-width="2" class="ping-circle"/>
    <circle cx="${sx}" cy="${sy}" r="8" fill="none" stroke="#f59e0b"
            stroke-width="1.5" class="ping-circle" style="animation-delay:.6s"/>
    <!-- Target marker -->
    <circle cx="${sx}" cy="${sy}" r="7" fill="#f59e0b" stroke="white" stroke-width="2"/>
  `;
}

/* ===========================================
   SEARCH & INTERACTION
   =========================================== */
let currentSpaceId = null;

function doSearch() {
  const raw = document.getElementById('searchInput').value.trim().toUpperCase();
  closeSuggestions();
  clearError();

  if (!raw) return;

  const space = spaceMap[raw];
  if (!space) {
    showError();
    clearSelection();
    return;
  }

  selectSpace(space.id);
}

function selectSpace(id) {
  const space = spaceMap[id];
  if (!space) return;

  document.getElementById('searchInput').value = id;
  document.getElementById('clearBtn').style.display = 'block';
  clearError();
  closeSuggestions();

  // Deselect previous
  if (currentSpaceId) {
    const prev = document.getElementById(`sp-${currentSpaceId}`);
    if (prev) {
      const ps = spaceMap[currentSpaceId];
      const fill   = ps.type === 'handicapped' ? '#0f4a3a' : '#1a3a6a';
      const stroke = ps.type === 'handicapped' ? '#059669' : '#2563eb';
      const r = prev.querySelector('rect');
      if (r) { r.setAttribute('fill', fill); r.setAttribute('stroke', stroke); }
      prev.classList.remove('sp-highlight');
    }
  }

  currentSpaceId = id;

  // Highlight new space
  const el = document.getElementById(`sp-${id}`);
  if (el) {
    const r = el.querySelector('rect');
    if (r) {
      r.setAttribute('fill', '#92400e');
      r.setAttribute('stroke', '#f59e0b');
    }
    el.classList.add('sp-highlight');
  }

  // Draw route
  drawRoute(space);

  // Show results
  showResult(space);

  // Scroll map to space
  scrollToSpace(space);
}

function showResult(space) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('routeSection').classList.add('show');

  document.getElementById('rcNum').textContent   = space.id;
  document.getElementById('rcZone').textContent  = space.zoneName;
  document.getElementById('rcTime').textContent  = space.walkTime;

  const badge = document.getElementById('rcBadge');
  if (space.type === 'handicapped') {
    badge.textContent = '♿ 殘障車位';
    badge.className   = 'type-badge type-dis';
  } else {
    badge.textContent = '🚗 一般車位';
    badge.className   = 'type-badge type-reg';
  }

  // Route steps
  const steps = getRouteSteps(space);
  const stepsHtml = steps.map((step, i) => `
    ${i > 0 ? '<div class="step-line"></div>' : ''}
    <div class="route-step">
      <div class="step-dot">${i+1}</div>
      <div class="step-txt">${step.icon} ${step.text}</div>
    </div>
  `).join('');
  document.getElementById('routeSteps').innerHTML = stepsHtml;
}

function clearSelection() {
  if (currentSpaceId) {
    const el = document.getElementById(`sp-${currentSpaceId}`);
    if (el) {
      const ps = spaceMap[currentSpaceId];
      const r = el.querySelector('rect');
      if (r) {
        r.setAttribute('fill', ps.type === 'handicapped' ? '#0f4a3a' : '#1a3a6a');
        r.setAttribute('stroke', ps.type === 'handicapped' ? '#059669' : '#2563eb');
      }
      el.classList.remove('sp-highlight');
    }
    currentSpaceId = null;
  }
  document.getElementById('routeLayer').innerHTML = '';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('routeSection').classList.remove('show');
  document.getElementById('emptyState').style.display = 'block';
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('clearBtn').style.display = 'none';
  clearSelection();
  clearError();
  closeSuggestions();
}

function showError() { document.getElementById('errMsg').classList.add('show'); }
function clearError() { document.getElementById('errMsg').classList.remove('show'); }

/* ===========================================
   AUTOCOMPLETE
   =========================================== */
const searchEl = document.getElementById('searchInput');
const sugEl    = document.getElementById('suggestions');

searchEl.addEventListener('input', () => {
  const val = searchEl.value.trim().toUpperCase();
  document.getElementById('clearBtn').style.display = val ? 'block' : 'none';

  if (!val || val.length < 1) { closeSuggestions(); return; }

  const matches = SPACES.filter(s => s.id.startsWith(val)).slice(0, 9);
  if (matches.length === 0) { closeSuggestions(); return; }

  sugEl.innerHTML = matches.map(s => `
    <div class="sug-item" onclick="selectSpace('${s.id}')">
      <span class="sug-id">${s.id}</span>
      <span class="sug-badge ${s.type === 'handicapped' ? 'badge-dis' : 'badge-reg'}">
        ${s.type === 'handicapped' ? '殘障' : '一般'}
      </span>
      <span class="sug-zone">${s.zoneName}</span>
    </div>
  `).join('');
  sugEl.style.display = 'block';
});

searchEl.addEventListener('keydown', e => {
  if (e.key === 'Enter')  { closeSuggestions(); doSearch(); }
  if (e.key === 'Escape') { closeSuggestions(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) closeSuggestions();
});

function closeSuggestions() { sugEl.style.display = 'none'; }

/* ===========================================
   MAP SCROLL TO SPACE
   =========================================== */
function scrollToSpace(space) {
  const mapArea = document.getElementById('mapArea');
  const svg     = document.getElementById('floorplan');
  const scaleX  = svg.clientWidth  / SVG_W;
  const scaleY  = svg.clientHeight / SVG_H;
  const cx = (space.x + space.w / 2) * scaleX;
  const cy = (space.y + space.h / 2) * scaleY;
  // Account for map padding (24px)
  mapArea.scrollTo({
    left: cx - mapArea.clientWidth  / 2 + 24,
    top:  cy - mapArea.clientHeight / 2 + 24,
    behavior: 'smooth',
  });
}

/* ===========================================
   ZOOM CONTROLS
   =========================================== */
let zoomLevel = 1;
const MIN_Z = 0.45, MAX_Z = 2.8, STEP = 1.22;

function applyZoom() {
  const svg = document.getElementById('floorplan');
  svg.setAttribute('width',  Math.round(DISP_W * zoomLevel));
  svg.setAttribute('height', Math.round(DISP_H * zoomLevel));
}
function zoomIn()    { zoomLevel = Math.min(MAX_Z, zoomLevel * STEP); applyZoom(); }
function zoomOut()   { zoomLevel = Math.max(MIN_Z, zoomLevel / STEP); applyZoom(); }
function resetZoom() { zoomLevel = 1; applyZoom(); }

/* ===========================================
   INITIALISATION
   =========================================== */
function init() {
  renderSpaces();

  // Update stats
  const total = SPACES.length;
  const dis   = SPACES.filter(s => s.type === 'handicapped').length;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('regCount').textContent   = total - dis;
  document.getElementById('disCount').textContent   = dis;
}

init();
</script>
