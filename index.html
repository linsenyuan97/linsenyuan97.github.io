<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>林森苑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2B2E33; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#EAE6DC; font-family:'Noto Sans TC', sans-serif; -webkit-font-smoothing:antialiased;}
  body{min-height:100vh; display:flex; justify-content:center;}
  .app{width:100%; max-width:480px; min-height:100vh; background:#EAE6DC; display:flex; flex-direction:column;}

  .stage{ flex:1 1 auto; }
  .stage svg{ display:block; width:100%; height:auto; }

  a.floor-link{ cursor:pointer; }
  a.floor-link:hover, a.floor-link:active{ opacity:0.92; }
</style>
</head>

<div class="app">

  <div class="stage">
<svg viewBox="0 -35 420 700" xmlns="http://www.w3.org/2000/svg">
<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93B7D8"/>
      <stop offset="50%" stop-color="#C5DCE8"/>
      <stop offset="100%" stop-color="#EEE9DC"/>
    </linearGradient>
    <linearGradient id="towerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7E1D3"/>
      <stop offset="55%" stop-color="#CBC2AE"/>
      <stop offset="100%" stop-color="#A79E8B"/>
    </linearGradient>
    <linearGradient id="towerShadeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B7AF9D"/>
      <stop offset="100%" stop-color="#948B78"/>
    </linearGradient>

    <!-- 5 大功能專屬磨砂玻璃微光漸層 (Glass Gradients) -->
    <!-- 1. 公設查詢：深邃海軍藍 -> 智慧寶藍 -->
    <linearGradient id="glassFacility" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#4F8DF7" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 2. 課程揪團：深邃紫羅蘭 -> 活力魅紫 -->
    <linearGradient id="glassCourse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D48ED" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#906EF9" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 3. 好物分享：深蒂芬妮綠 -> 晶透翡翠綠 -->
    <linearGradient id="glassShare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#089A95" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1ED1CA" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 4. 書籍捐贈：溫潤古籍土褐 -> 典雅赤陶赭石 -->
    <linearGradient id="glassBook" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B5B47" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#9C7963" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 5. 車位查詢：黑曜深邃藍 -> 科技極夜暗藍 -->
    <linearGradient id="glassParking" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090E17" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1B2638" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 頂級懸浮立體投影 (3D Glass Elevation Shadow) -->
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#151A22" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
