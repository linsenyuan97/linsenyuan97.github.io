<style>
  :root{ --ink:#2B2E33; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    height:100dvh;
    margin:0;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
    background:#EAE6DC;
    font-family:'Noto Sans TC', sans-serif;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  body{
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .app{
    width:100%;
    max-width:480px;
    height:100%;
    height:100dvh;
    background:#EAE6DC;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
  }

  .stage{
    flex:1 1 100%;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
  }
  .stage svg{
    display:block;
    width:100%;
    height:100%;
    max-height:100dvh;
  }

  a.floor-link{
    cursor:pointer;
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.15s ease, opacity 0.15s ease;
  }
  a.floor-link:hover{ opacity:0.95; }
  a.floor-link:active{ transform:scale(0.985); }

  /* 桌面/平板：兩側留白用「模糊放大版插畫」當背景，中間手機畫面浮起來，
     只在螢幕夠寬時套用，480px 以下(手機)完全不受影響 */
  .bg-blur{
    display:none;
  }
  @media (min-width: 481px) {
    html, body{
      background:#0B1220; /* 背景圖載入前的保底底色 */
    }
    .bg-blur{
      display:block;
      position:fixed;
      inset:0;
      z-index:0;
      overflow:hidden;
      pointer-events:none;
    }
    .bg-blur svg{
      position:absolute;
      top:50%; left:50%;
      width:150%; height:150%;
      transform:translate(-50%,-50%) scale(1.25);
      filter:blur(46px) brightness(0.55) saturate(1.15);
    }
    .bg-blur::after{
      content:"";
      position:absolute; inset:0;
      background:rgba(10,16,28,0.35);
    }
    .app{
      position:relative;
      z-index:1;
      /* 卡片長寬比例直接鎖定跟插畫 viewBox(420:700 = 0.6)一致，
         不管視窗高度多少，都不會有兩側或上下露出底色的情況 */
      width: min(480px, 100dvh * 0.6);
      height: min(100dvh, 800px);
      border-radius: 36px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.08);
    }
  }

  /* 呼吸燈向右導引微動態 (Gentle Pulse & Subtle Nudge) */
  .btn-arrow {
    animation: arrowPulse 2.4s ease-in-out infinite;
  }
  @keyframes arrowPulse {
    0%, 100% {
      opacity: 0.55;
      transform: translateX(0);
    }
    50% {
      opacity: 1;
      transform: translateX(3px);
      filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.9));
    }
  }
</style>
</head>

<div class="bg-blur" id="bgBlur" aria-hidden="true"></div>

<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93B7D8"/>
      <stop offset="50%" stop-color="#C5DCE8"/>
      <stop offset="100%" stop-color="#EEE9DC"/>
    </linearGradient>
    <linearGradient id="towerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E7E1D3"/>
      <stop offset="55%" stop-color="#CBC2AE"/>
      <stop offset="100%" stop-color="#A79E8B"/>
    </linearGradient>
    <linearGradient id="towerShadeSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B7AF9D"/>
      <stop offset="100%" stop-color="#948B78"/>
    </linearGradient>

    <!-- 5 大功能專屬磨砂玻璃微光漸層 (Glass Gradients) -->
    <!-- 1. 公設查詢：深邃海軍藍 -> 智慧寶藍 -->
    <linearGradient id="glassFacility" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#4F8DF7" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 2. 課程揪團：深邃紫羅蘭 -> 活力魅紫 -->
    <linearGradient id="glassCourse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D48ED" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#906EF9" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 3. 好物分享：深蒂芬妮綠 -> 晶透翡翠綠 -->
    <linearGradient id="glassShare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#089A95" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#1ED1CA" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 4. 書籍捐贈：溫潤古籍土褐 -> 典雅赤陶赭石 -->
    <linearGradient id="glassBook" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7B5B47" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#9C7963" stop-opacity="0.94"/>
    </linearGradient>
    <!-- 5. 車位查詢：黑曜深邃藍 -> 科技極夜暗藍 -->
    <linearGradient id="glassParking" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090E17" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1B2638" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 石牌文字專用光暈：純模糊、範圍更大，因為底下這份會被上層文字完全蓋住，
         露出來的只有模糊外溢的部分，所以模糊強度要夠明顯才看得出來 -->
    <filter id="textGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4.5"/>
    </filter>
    <!-- 頂級懸浮立體投影 (3D Glass Elevation Shadow) -->
    <filter id="glassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#151A22" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    <!-- 中央聚光暗角漸層 (Subtle Vignette Spotlight) -->
    <radialGradient id="skyVignette" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#7B9BB8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.18"/>
    </radialGradient>
    <!-- 夜間天空漸層(依實際時間切換用，見頁尾 <script> 的 NIGHT_MODE 設定) -->
    <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#2A2340"/>
    </linearGradient>
  </defs>

<script>
  // ── 夜間模式設定 ────────────────────────────────────────────
  // enabled  : 要不要啟用夜間模式判斷。之後想整個關掉，改成 false 即可。
  // startHour: 晚上從幾點開始算「夜間」(24 小時制)
  // endHour  : 早上到幾點結束「夜間」(24 小時制)
  //            範例：19、6 代表晚上 7 點 ~ 隔天早上 6 點都算夜間
  const NIGHT_MODE = {
    enabled: true,
    startHour: 19,
    endHour: 6
  };

  function isNightNow(cfg) {
    const hour = new Date().getHours();
    if (cfg.startHour === cfg.endHour) return false;
    if (cfg.startHour > cfg.endHour) {
      // 跨過午夜的區間，例如 19 點 ~ 隔天 6 點
      return hour >= cfg.startHour || hour < cfg.endHour;
    }
    return hour >= cfg.startHour && hour < cfg.endHour;
  }

  function applyNightModeIfNeeded() {
    if (!NIGHT_MODE.enabled) return;
    if (!isNightNow(NIGHT_MODE)) return;

    const skyRect = document.getElementById('skyRect');
    const clouds = document.getElementById('cloudsGroup');
    const brandTitle = document.getElementById('brandTitle');
    const brandPin = document.getElementById('brandPin');
    const plaqueTextGlow = document.getElementById('plaqueTextGlow');
    const sideBuildings = document.getElementById('sideBuildings');
    if (skyRect) skyRect.setAttribute('fill', 'url(#skyNight)');
    if (clouds) clouds.setAttribute('opacity', '0.15');
    if (brandTitle) brandTitle.setAttribute('fill', '#FFFFFF');
    if (brandPin) brandPin.setAttribute('stroke', '#F7D375'); // 月光黃，呼應窗戶暖燈色
    if (plaqueTextGlow) plaqueTextGlow.setAttribute('opacity', '0.9'); // 「林森苑」每個字貼合字形透出黃光
    if (sideBuildings) sideBuildings.setAttribute('opacity', '0.35'); // 兩側配角大樓夜晚調暗，融入夜色，避免屋頂太搶眼
  }

  applyNightModeIfNeeded();

  // ── 桌面/平板背景：複製一份主插畫，去除所有 id 後模糊當背景 ──────
  // 去除 id 是為了避免這份「純裝飾用的複製品」跟畫面上真正的按鈕/夜間模式
  // 邏輯共用同一個 id 而互相干擾(getElementById 只會抓到第一個)。
  function setupDesktopBlurBackground() {
    const bgHost = document.getElementById('bgBlur');
    const sourceSvg = document.querySelector('.stage svg');
    if (!bgHost || !sourceSvg) return;

    const clone = sourceSvg.cloneNode(true);
    // 只拿掉會跟 getElementById 衝突的那幾個 id，SVG 內部漸層/濾鏡用的 id
    // (例如 #sky、#glow)要保留，否則複製品的顏色跟特效會整個失效。
    const idsToStrip = ['skyRect', 'cloudsGroup', 'brandTitle', 'brandPin', 'plaqueTextGlow', 'sideBuildings'];
    idsToStrip.forEach(function (id) {
      const el = clone.querySelector('#' + id);
      if (el) el.removeAttribute('id');
    });
    // 背景裝飾用，不需要可以點擊的連結
    clone.querySelectorAll('a').forEach(function (a) {
      a.style.pointerEvents = 'none';
    });

    bgHost.innerHTML = '';
    bgHost.appendChild(clone);
  }

  setupDesktopBlurBackground();
</script>
