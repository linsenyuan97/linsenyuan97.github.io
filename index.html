<title>林森苑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2B2E33; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:#EAE6DC; font-family:'Noto Sans TC', sans-serif; -webkit-font-smoothing:antialiased;}
  body{min-height:100vh; display:flex; justify-content:center;}
  .app{width:100%; max-width:480px; min-height:100vh; background:#EAE6DC; display:flex; flex-direction:column;}

  header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:#fff;
  }
  .brand{ display:flex; align-items:center; gap:6px; font-family:'Noto Serif TC',serif; font-weight:900; font-size:18px; color:var(--ink); letter-spacing:0.06em; }
  .brand svg{ width:18px; height:18px; color:#D96B63; flex-shrink:0; }
  .status{ font-size:11px; color:#9A9484; }

  .stage{ flex:1 1 auto; }
  .stage svg{ display:block; width:100%; height:auto; }

  a.floor-link{ cursor:pointer; }
  a.floor-link:hover, a.floor-link:active{ opacity:0.92; }
</style>
</head>

        <circle cx="12" cy="10" r="3"></circle>

      <span>林森苑</span>
    </div>
    <div class="status">9 月 8 日 週二</div>
