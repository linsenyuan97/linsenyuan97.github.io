<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="林森苑會議辨識">
<meta name="theme-color" content="#C97A3D">
<title>林森苑會議辨識字幕</title>
<link rel="apple-touch-icon" href="icons/trans/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/trans/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/trans/icon-192.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/trans/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2430;
    --ink-soft:#3C4A5C;
    --paper:#F3F5F4;
    --paper-card:#FFFFFF;
    --line:#DADFE0;
    --amber:#C97A3D;
    --amber-soft:#F1DFCB;
    --ok:#3E7A5C;
    --ok-bg:#E4EFE8;
    --err:#B3503F;
    --err-bg:#F6E4E0;
    --wait-bg:#EFEAE0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:48px 24px 96px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:40px;
  }
  .wave{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:28px;
    flex-shrink:0;
  }
  .wave span{
    width:3px;
    background:var(--amber);
    border-radius:2px;
    animation:bounce 1.4s ease-in-out infinite;
  }
  .wave span:nth-child(1){height:10px;animation-delay:0s;}
  .wave span:nth-child(2){height:22px;animation-delay:0.15s;}
  .wave span:nth-child(3){height:14px;animation-delay:0.3s;}
  .wave span:nth-child(4){height:26px;animation-delay:0.45s;}
  .wave span:nth-child(5){height:8px;animation-delay:0.6s;}
  @keyframes bounce{
    0%,100%{transform:scaleY(1);}
    50%{transform:scaleY(0.4);}
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--amber);
  }
  header p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--ink-soft);
  }

  /* ---------- Upload zone ---------- */
  .dropzone{
    display:block;
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    background:var(--paper-card);
    padding:40px 24px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone.drag{
    border-color:var(--amber);
    background:var(--amber-soft);
  }
  .dropzone-icon{
    margin-bottom:12px;
  }
  .dropzone h2{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:18px;
    margin:0 0 6px;
    color:var(--amber);
  }
  .dropzone p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
  }
  .dropzone input{display:none;}

  .upload-progress{
    margin-top:14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
    display:none;
  }
  .upload-progress.show{display:block;}

  /* ---------- Section label (壓在區塊邊框上) ---------- */
  .record-section{
    position:relative;
    margin-top:44px;
  }
  .record-label{
    position:absolute;
    top:-10px;
    left:16px;
    background:var(--paper);
    padding:0 8px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:18px;
    color:var(--amber);
    letter-spacing:.01em;
    z-index:1;
  }

  /* ---------- Cards ---------- */
  .empty{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-card);
    padding:32px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }
  .loading-state{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-card);
    padding:32px 20px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .loading-dots{
    display:inline-flex;
    gap:4px;
  }
  .loading-dots span{
    width:6px;
    height:6px;
    background:var(--amber);
    border-radius:50%;
    animation:dotPulse 1.2s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2){ animation-delay:0.2s; }
  .loading-dots span:nth-child(3){ animation-delay:0.4s; }
  @keyframes dotPulse{
    0%,80%,100%{ transform:scale(0.6); opacity:0.4; }
    40%{ transform:scale(1.1); opacity:1; }
  }
  .cards{
    display:flex;
    flex-direction:column;
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--paper-card);
    padding:16px 20px;
    border-bottom:1px solid var(--line);
  }
  .card:last-child{
    border-bottom:none;
  }
  .card .fname{
    font-weight:600;
    font-size:14px;
    margin:0 0 3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .card .info{flex:1;min-width:0;}

  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:.04em;
    padding:4px 9px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .badge.processing{background:var(--wait-bg);color:#7A6A3F;}
  .badge.done{background:var(--ok-bg);color:var(--ok);}
  .badge.error{background:var(--err-bg);color:var(--err);}

  .btn-view{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
    flex-shrink:0;
    transition:opacity .15s ease;
  }
  .btn-view:disabled{
    background:transparent;
    color:var(--line);
    border-color:var(--line);
    cursor:not-allowed;
  }
  .btn-view:not(:disabled):hover{opacity:.85;}

  /* ---------- Dialog ---------- */
  dialog{
    border:none;
    border-radius:14px;
    padding:0;
    width:min(600px, 90vw);
    max-height:80vh;
    box-shadow:0 20px 60px rgba(27,36,48,.25);
  }
  dialog::backdrop{background:rgba(27,36,48,.45);}
  .dialog-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:20px 22px 14px;
    border-bottom:1px solid var(--line);
  }
  .dialog-head h4{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:17px;
    margin:0 0 4px;
  }
  .dialog-head .meta{
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .dialog-close{
    border:none;
    background:none;
    font-size:20px;
    line-height:1;
    color:var(--ink-soft);
    cursor:pointer;
    padding:2px 4px;
  }
  .dialog-body{
    padding:18px 22px 22px;
    overflow-y:auto;
    max-height:calc(80vh - 74px);
    font-size:14px;
    line-height:1.75;
    white-space:pre-wrap;
  }
  .dialog-actions{
    padding:0 22px 20px;
    display:flex;
    justify-content:flex-end;
  }
  .btn-copy{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    background:none;
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 12px;
    cursor:pointer;
    color:var(--ink-soft);
  }
  .btn-copy:hover{border-color:var(--ink-soft);color:var(--ink);}

  @media (prefers-reduced-motion: reduce){
    .wave span{animation:none;}
    .toast{transition:none !important;}
  }

  /* ---------- Toast 成功訊息 ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translate(-50%, 20px);
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--ink);
    color:#fff;
    padding:13px 20px;
    border-radius:10px;
    font-size:13.5px;
    font-weight:500;
    box-shadow:0 10px 30px rgba(27,36,48,.28);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .toast .tick{
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--amber);
    flex-shrink:0;
    position:relative;
  }
  .toast .tick::after{
    content:"";
    position:absolute;
    left:5px;
    top:3.5px;
    width:5px;
    height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    <h1>林森苑會議辨識字幕</h1>
  </header>

  <label class="dropzone" id="dropzone">
    <svg class="dropzone-icon" width="46" height="46" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- 後方檔案（白底橘框) -->
      <path d="M14 8C14 6.34315 15.3431 5 17 5H31L39 13V40C39 41.6569 37.6569 43 36 43H17C15.3431 43 14 41.6569 14 40V8Z" fill="var(--paper-card)" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M31 5L39 13H33C31.8954 13 31 12.1046 31 11V5Z" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round"/>
      <!-- 後方檔案文字線條（放在露出的右側區域） -->
      <line x1="31" y1="20" x2="37" y2="20" stroke="var(--amber-soft)" stroke-width="2" stroke-linecap="round"/>
      <line x1="31" y1="26" x2="37" y2="26" stroke="var(--amber-soft)" stroke-width="2" stroke-linecap="round"/>
      <line x1="31" y1="32" x2="37" y2="32" stroke="var(--amber-soft)" stroke-width="2" stroke-linecap="round"/>

      <!-- 前方檔案（白底橘框，含折角) -->
      <path d="M6 12C6 10.3431 7.34315 9 9 9H21L29 17V38C29 39.6569 27.6569 41 26 41H9C7.34315 41 6 39.6569 6 38V12Z" fill="var(--paper-card)" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round"/>
      <path d="M21 9L29 17H23C21.8954 17 21 16.1046 21 15V9Z" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="2" stroke-linejoin="round"/>

      <!-- 喇叭圖示 -->
      <g transform="translate(9.5, 20)">
        <rect x="0" y="4.5" width="4" height="7" fill="var(--amber-soft)" stroke="var(--amber)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M4 4.5L10.5 0V16L4 11.5V4.5Z" fill="none" stroke="var(--amber)" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M14 4.5C15.2 5.6 15.2 10.4 14 11.5" stroke="var(--amber)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
        <path d="M16.3 2C18.6 4.4 18.6 11.6 16.3 14" stroke="var(--amber)" stroke-width="1.4" stroke-linecap="round" fill="none"/>
      </g>
    </svg>
    <h2>拖放檔案到這裡，或點擊選擇音訊 / 影片</h2>
    <p>支援 mp3、wav、m4a、mp4 等格式</p>
    <input type="file" id="fileInput" accept="audio/*,video/*">
    <div class="upload-progress" id="uploadProgress">上傳中…</div>
  </label>

  <div class="record-section">
    <span class="record-label">辨識紀錄</span>
    <div id="loadingState" class="loading-state">
      <span>載入紀錄中</span>
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
    <div id="emptyState" class="empty" style="display:none;">還沒有上傳過檔案</div>
    <div class="cards" id="cardList" style="display:none;"></div>
  </div>
</div>

<dialog id="transcriptDialog">
  <div class="dialog-head">
    <div>
      <h4 id="dialogTitle">逐字稿</h4>
      <div class="meta" id="dialogMeta"></div>
    </div>
    <button class="dialog-close" id="dialogClose" aria-label="關閉">✕</button>
  </div>
  <div class="dialog-body" id="dialogBody"></div>
  <div class="dialog-actions">
    <button class="btn-copy" id="dialogCopy">複製全文</button>
  </div>
</dialog>

<div class="toast" id="toast">
  <span class="tick"></span>
  <span id="toastText"></span>
</div>

<script>
/* =========================================================================
   設定區：部署自己的 Google Apps Script Web App 後，把網址填在這裡。
   若留空，頁面會用「模擬模式」在瀏覽器內展示流程（僅供預覽介面用）。
   ========================================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbygmdRLnrJiI1MUnTE4lPnkevd_YbZFw0CaDHDjWgCHK56sKE-tvTBYrpDATgn5cWca/exec"; // 例如 "https://script.google.com/macros/s/AKfycb.../exec"

const STORAGE_KEY = "transcript_tasks";
let tasks = [];

/* ---------- Toast 訊息 ---------- */
let toastTimer = null;
function showToast(message){
  const toast = document.getElementById("toast");
  document.getElementById("toastText").textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 3200);
}

/* ---------- 初始化：直接向 Google Sheet (Apps Script) 要求最新紀錄 ---------- */
async function loadTasks(){
  isLoading = true;
  render();
  if (!API_URL) {
    isLoading = false;
    render();
    return;
  }
  try{
    const res = await fetch(`${API_URL}?action=list`);
    const data = await res.json();
    if (data.ok && Array.isArray(data.tasks)) {
      tasks = data.tasks;
      // 對處理中的任務啟動輪詢
      tasks.filter(t => t.status === "processing").forEach(t => pollStatus(t.taskId));
    }
  }catch(e){
    console.error("讀取 Google Sheet 紀錄失敗", e);
  }finally{
    isLoading = false;
    render();
  }
}

/* ---------- 上傳 ---------- */
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const uploadProgress = document.getElementById("uploadProgress");

fileInput.addEventListener("change", () => {
  if (fileInput.files[0]) handleUpload(fileInput.files[0]);
});

["dragover","dragenter"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add("drag"); })
);
["dragleave","drop"].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
);
dropzone.addEventListener("drop", e => {
  const file = e.dataTransfer.files[0];
  if (file) handleUpload(file);
});

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = err => reject(err);
    reader.readAsDataURL(file);
  });
}

async function handleUpload(file){
  uploadProgress.classList.add("show");
  uploadProgress.textContent = `上傳中… ${file.name}`;

  const taskId = crypto.randomUUID();
  const task = {
    taskId,
    fileName: file.name,
    uploadedAt: new Date().toISOString(),
    status: "processing",
    transcript: ""
  };
  tasks.unshift(task);
  render();

  try{
    if (API_URL) {
      // ---- 正式模式：轉為 Base64 傳送至 Apps Script ----
      const base64Data = await fileToBase64(file);
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "upload",
          taskId: taskId,
          fileName: file.name,
          fileData: base64Data
        })
      });
      showToast("上傳檔案成功，稍後回來查看辨識結果");
      pollStatus(taskId);
    } else {
      // ---- 模擬模式：僅供介面預覽，非真正辨識 ----
      showToast("上傳檔案成功，稍後回來查看辨識結果");
      setTimeout(async () => {
        const t = tasks.find(x => x.taskId === taskId);
        if (!t) return;
        t.status = "done";
        t.transcript =
          "【模擬模式提示】尚未設定 API_URL，這是示範文字，非真實辨識結果。\n\n" +
          "設定 API_URL 後，這裡會顯示 GitHub Actions 辨識完成、寫回 Google Sheet 的實際逐字稿內容。\n\n" +
          "00:00:03 主持人：那我們開始這次的會議。\n" +
          "00:00:08 與會者A：好的，先確認一下上次會議的待辦事項進度。\n" +
          "00:00:21 主持人：目前完成三項，還有兩項在進行中……";
        render();
      }, 4000);
    }
  } catch(err){
    const t = tasks.find(x => x.taskId === taskId);
    if (t) t.status = "error";
    render();
  } finally {
    uploadProgress.classList.remove("show");
    fileInput.value = "";
  }
}

/* ---------- 查詢狀態（正式模式用，向 Apps Script doGet 查詢） ---------- */
async function pollStatus(taskId){
  if (!API_URL) return;
  try{
    const res = await fetch(`${API_URL}?action=status&taskId=${taskId}`);
    const data = await res.json();
    const t = tasks.find(x => x.taskId === taskId);
    if (!t) return;

    if (data.status === "done") {
      t.status = "done";
      t.transcript = data.transcript || "";
      render();
    } else if (data.status === "error") {
      t.status = "error";
      render();
    } else if (data.status === "not_found") {
      // 若後端資料庫（Google Sheet）該筆資料已被刪除，從畫面中同步移除
      tasks = tasks.filter(x => x.taskId !== taskId);
      render();
    } else {
      // 仍處理中，30 秒後再查一次
      setTimeout(() => pollStatus(taskId), 30000);
    }
  }catch(e){
    setTimeout(() => pollStatus(taskId), 30000);
  }
}


/* ---------- 卡片清單渲染 ---------- */
const cardList = document.getElementById("cardList");
const emptyState = document.getElementById("emptyState");
const loadingState = document.getElementById("loadingState");

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
}

const badgeText = { processing: "處理中", done: "已完成", error: "失敗" };

function render(){
  if (isLoading) {
    if (loadingState) loadingState.style.display = "flex";
    emptyState.style.display = "none";
    cardList.style.display = "none";
    return;
  }
  if (loadingState) loadingState.style.display = "none";
  emptyState.style.display = tasks.length ? "none" : "block";
  cardList.style.display = tasks.length ? "flex" : "none";
  cardList.innerHTML = "";

  tasks.forEach(t => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="info">
        <p class="fname">${escapeHtml(t.fileName)}</p>
        <div class="meta">上傳於 ${formatDate(t.uploadedAt)}</div>
      </div>
      <span class="badge ${t.status}">${badgeText[t.status] || t.status}</span>
      <button class="btn-view" ${t.status !== "done" ? "disabled" : ""}>查看</button>
    `;
    card.querySelector(".btn-view").addEventListener("click", () => openDialog(t));
    cardList.appendChild(card);
  });
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Dialog ---------- */
const dialog = document.getElementById("transcriptDialog");
document.getElementById("dialogClose").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

async function openDialog(task){
  document.getElementById("dialogTitle").textContent = task.fileName;
  document.getElementById("dialogMeta").textContent = `上傳於 ${formatDate(task.uploadedAt)}`;
  dialog.showModal();

  if (task.transcript) {
    document.getElementById("dialogBody").textContent = task.transcript;
  } else {
    document.getElementById("dialogBody").textContent = "載入逐字稿中…";
    if (API_URL) {
      try {
        const res = await fetch(`${API_URL}?action=status&taskId=${task.taskId}`);
        const data = await res.json();
        task.transcript = data.transcript || "（無內容）";
        document.getElementById("dialogBody").textContent = task.transcript;
      } catch(e) {
        document.getElementById("dialogBody").textContent = "（讀取逐字稿失敗）";
      }
    }
  }
}

document.getElementById("dialogCopy").addEventListener("click", () => {
  const text = document.getElementById("dialogBody").textContent;
  navigator.clipboard.writeText(text);
  const btn = document.getElementById("dialogCopy");
  const original = btn.textContent;
  btn.textContent = "已複製";
  setTimeout(() => btn.textContent = original, 1500);
});

/* ---------- 啟動 ---------- */
loadTasks();
</script>
