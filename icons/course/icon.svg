<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 1. 經典大圓角藍底 (與 share / book 完全一致) -->
  <rect width="512" height="512" rx="115" fill="#3474CC"/>

  <!-- 2. 背景三棟大樓 (完全原版結構) -->
  <g fill="#FFFFFF">
    <rect x="90" y="230" width="90" height="215"/>
    <rect x="190" y="160" width="110" height="285"/>
    <rect x="310" y="210" width="90" height="235"/>
  </g>

  <!-- 大樓窗戶 (鏤空為底色 #3474CC) -->
  <g fill="#3474CC">
    <!-- 左棟窗戶 (3欄 x 6列) -->
    <g transform="translate(98, 250)">
      <rect x="0" y="0" width="16" height="20"/><rect x="29" y="0" width="16" height="20"/><rect x="58" y="0" width="16" height="20"/>
      <rect x="0" y="30" width="16" height="20"/><rect x="29" y="30" width="16" height="20"/><rect x="58" y="30" width="16" height="20"/>
      <rect x="0" y="60" width="16" height="20"/><rect x="29" y="60" width="16" height="20"/><rect x="58" y="60" width="16" height="20"/>
      <rect x="0" y="90" width="16" height="20"/><rect x="29" y="90" width="16" height="20"/><rect x="58" y="90" width="16" height="20"/>
      <rect x="0" y="120" width="16" height="20"/><rect x="29" y="120" width="16" height="20"/><rect x="58" y="120" width="16" height="20"/>
      <rect x="0" y="150" width="16" height="20"/><rect x="29" y="150" width="16" height="20"/><rect x="58" y="150" width="16" height="20"/>
    </g>

    <!-- 中棟窗戶 (3欄 x 8列) -->
    <g transform="translate(200, 180)">
      <rect x="0" y="0" width="18" height="24"/><rect x="36" y="0" width="18" height="24"/><rect x="72" y="0" width="18" height="24"/>
      <rect x="0" y="34" width="18" height="24"/><rect x="36" y="34" width="18" height="24"/><rect x="72" y="34" width="18" height="24"/>
      <rect x="0" y="68" width="18" height="24"/><rect x="36" y="68" width="18" height="24"/><rect x="72" y="68" width="18" height="24"/>
      <rect x="0" y="102" width="18" height="24"/><rect x="36" y="102" width="18" height="24"/><rect x="72" y="102" width="18" height="24"/>
      <rect x="0" y="136" width="18" height="24"/><rect x="36" y="136" width="18" height="24"/><rect x="72" y="136" width="18" height="24"/>
      <rect x="0" y="170" width="18" height="24"/><rect x="36" y="170" width="18" height="24"/><rect x="72" y="170" width="18" height="24"/>
      <rect x="0" y="204" width="18" height="24"/><rect x="36" y="204" width="18" height="24"/><rect x="72" y="204" width="18" height="24"/>
      <rect x="0" y="238" width="18" height="24"/><rect x="36" y="238" width="18" height="24"/><rect x="72" y="238" width="18" height="24"/>
    </g>

    <!-- 右棟窗戶 (3欄 x 6列) -->
    <g transform="translate(318, 230)">
      <rect x="0" y="0" width="16" height="20"/><rect x="29" y="0" width="16" height="20"/><rect x="58" y="0" width="16" height="20"/>
      <rect x="0" y="30" width="16" height="20"/><rect x="29" y="30" width="16" height="20"/><rect x="58" y="30" width="16" height="20"/>
      <rect x="0" y="60" width="16" height="20"/><rect x="29" y="60" width="16" height="20"/><rect x="58" y="60" width="16" height="20"/>
      <rect x="0" y="90" width="16" height="20"/><rect x="29" y="90" width="16" height="20"/><rect x="58" y="90" width="16" height="20"/>
      <rect x="0" y="120" width="16" height="20"/><rect x="29" y="120" width="16" height="20"/><rect x="58" y="120" width="16" height="20"/>
      <rect x="0" y="150" width="16" height="20"/><rect x="29" y="150" width="16" height="20"/><rect x="58" y="150" width="16" height="20"/>
    </g>
  </g>

  <!-- 3. 右下角紫色圓圈徽章 -->
  <g id="badge">
    <defs>
      <clipPath id="circleClip">
        <circle cx="370" cy="370" r="118"/>
      </clipPath>
    </defs>

    <!-- 圓圈白邊與紫底 -->
    <circle cx="370" cy="370" r="126" fill="#FFFFFF"/>
    <circle cx="370" cy="370" r="118" fill="#7C5CFC"/>

    <!-- 紫色圓圈內部 -->
    <g clip-path="url(#circleClip)">
      
      <!-- (A) 後方加大日曆 (線更短、面積更大) -->
      <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
        <!-- 日曆主外框 (加大：寬 152、高 112，起點 (294, 274)) -->
        <rect x="294" y="274" width="152" height="112" rx="16" stroke-width="8"/>
        
        <!-- 頂部橫線 -->
        <line x1="294" y1="306" x2="446" y2="306" stroke-width="8"/>
        
        <!-- 吊日曆的線/裝訂環 (短線：長度僅 10px，緊湊短小) -->
        <line x1="330" y1="265" x2="330" y2="279" stroke-width="8"/>
        <line x1="410" y1="265" x2="410" y2="279" stroke-width="8"/>
        
        <!-- 日曆中間加大醒目的打勾 ✓ -->
        <path d="M 348 340 L 366 358 L 404 322" stroke-width="10"/>
      </g>

      <!-- (B) 前方三個人物 -->
      <!-- 1. 左邊人物 -->
      <g>
        <circle cx="314" cy="392" r="18" fill="#FFFFFF"/>
        <path d="M 284 450 C 284 416 296 412 314 412 C 332 412 344 416 344 450 Z" fill="#FFFFFF"/>
      </g>

      <!-- 2. 右邊人物 -->
      <g>
        <circle cx="426" cy="392" r="18" fill="#FFFFFF"/>
        <path d="M 396 450 C 396 416 408 412 426 412 C 444 412 456 416 456 450 Z" fill="#FFFFFF"/>
      </g>

      <!-- 3. 中間人物 (最前層，立體微縫間隙) -->
      <g>
        <!-- 中間人物頭部 -->
        <circle cx="370" cy="376" r="24" fill="#7C5CFC"/>
        <circle cx="370" cy="376" r="19" fill="#FFFFFF"/>

        <!-- 中間人物身體 -->
        <path d="M 332 455 C 332 408 346 400 370 400 C 394 400 408 408 408 455 Z" fill="#7C5CFC"/>
        <path d="M 336 455 C 336 412 348 404 370 404 C 392 404 404 412 404 455 Z" fill="#FFFFFF"/>
      </g>

    </g>
  </g>
</svg>
